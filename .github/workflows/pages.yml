name: Publicar en GitHub Pages

# Copia main a la rama gh-pages, desde la que GitHub Pages sirve el sitio.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git push --force origin HEAD:gh-pages
